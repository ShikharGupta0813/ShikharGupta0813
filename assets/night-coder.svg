<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#1E070D"/>
      <stop offset="1" stop-color="#05060A"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5368"/>
      <stop offset="0.55" stop-color="#B0152C"/>
      <stop offset="1" stop-color="#3A0A16"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eyeClip"><path d="M100 190 Q260 70 420 190 Q260 310 100 190 Z"/></clipPath>
    <path id="r1" d="M260 190 m-66 0 a66 66 0 1 1 132 0 a66 66 0 1 1 -132 0"/>
    <path id="r2" d="M260 190 m-48 0 a48 48 0 1 0 96 0 a48 48 0 1 0 -96 0"/>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#FF5368" stroke-opacity=".06"/>
    </pattern>
    <style>
      .ring{font:700 9px 'JetBrains Mono',Consolas,monospace;fill:#FFD0D6;letter-spacing:1px}
      .spin{animation:spin 14s linear infinite;transform-origin:260px 190px}
      .spinR{animation:spin 9s linear infinite reverse;transform-origin:260px 190px}
      @keyframes spin{to{transform:rotate(360deg)}}
      .lid{animation:lid 6s infinite;transform-origin:260px 190px}
      @keyframes lid{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.06)}96%{transform:scaleY(1)}}
      .pupil{animation:pupil 4s ease-in-out infinite;transform-origin:260px 190px}
      @keyframes pupil{50%{transform:scaleX(.6)}}
      .gA{opacity:0;animation:gA 3s infinite steps(1)}
      @keyframes gA{0%,86%,100%{transform:translate(0,0);opacity:0}88%{transform:translate(-8px,2px);opacity:.6}91%{transform:translate(6px,-3px);opacity:.5}94%{opacity:0}}
      .log{font:500 10px 'JetBrains Mono',Consolas,monospace;fill:#8B929E}
      .ok{fill:#3DFF8A}
      .l1{animation:show 8s infinite}.l2{animation:show 8s infinite .6s}.l3{animation:show 8s infinite 1.2s}.l4{animation:show 8s infinite 1.8s}
      @keyframes show{0%{opacity:0}4%{opacity:1}92%{opacity:1}100%{opacity:0}}
      .scan{animation:scan 5s linear infinite}
      @keyframes scan{from{transform:translateY(-30px)}to{transform:translateY(420px)}}
      .cur{animation:cur 1s steps(1) infinite}@keyframes cur{50%{opacity:0}}
    </style>
  </defs>

  <rect width="520" height="400" fill="url(#bg)"/>
  <rect width="520" height="400" fill="url(#grid)"/>

  <!-- boot log -->
  <g>
    <text x="24" y="36" class="log l1">[ <tspan class="ok">OK</tspan> ] mounting /prod/upi-core</text>
    <text x="24" y="52" class="log l2">[ <tspan class="ok">OK</tspan> ] nifi: summary rollups online</text>
    <text x="300" y="36" class="log l3">[ <tspan class="ok">OK</tspan> ] qdrant: vectors indexed</text>
    <text x="300" y="52" class="log l4">[ <tspan class="ok">OK</tspan> ] grafana: watching everything</text>
  </g>

  <!-- the eye -->
  <g class="lid">
    <path d="M100 190 Q260 70 420 190 Q260 310 100 190 Z" fill="#0A0B10" stroke="#FF5368" stroke-width="2" filter="url(#glow)"/>
    <g clip-path="url(#eyeClip)">
      <circle cx="260" cy="190" r="84" fill="url(#iris)" filter="url(#glow)"/>
      <g class="spin">
        <text class="ring"><textPath href="#r1">01001011 · SELECT * FROM bugs WHERE alive=1 · DROP · 0xDEADBEEF ·</textPath></text>
      </g>
      <g class="spinR">
        <text class="ring" style="font-size:8px;fill:#FFB4BE"><textPath href="#r2">git push · deploy · observe · repeat ·</textPath></text>
      </g>
      <circle cx="260" cy="190" r="84" fill="none" stroke="#05060A" stroke-width="4"/>
      <ellipse class="pupil" cx="260" cy="190" rx="10" ry="34" fill="#05060A"/>
      <circle cx="284" cy="164" r="6" fill="#fff" opacity=".85"/>
      <!-- glitch slices -->
      <rect class="gA" x="100" y="172" width="320" height="10" fill="#FF2D4A"/>
      <rect class="gA" x="100" y="206" width="320" height="6" fill="#3DE0FF" style="animation-delay:-.4s"/>
    </g>
  </g>

  <text x="260" y="330" text-anchor="middle" style="font:700 13px 'JetBrains Mono',monospace;fill:#FF5368;letter-spacing:5px">I SEE EVERY BUG</text>
  <rect class="scan" x="0" y="0" width="520" height="24" fill="#FF5368" opacity=".04"/>
  <text x="24" y="380" class="log">root@shikhar:~$ <tspan class="cur" fill="#FF5368">█</tspan></text>
</svg>
