name: Generate profile cards (snake + telemetry)

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate telemetry card (includes private repos)
        continue-on-error: true
        env:
          GH_USER: ${{ github.repository_owner }}
          PR_TOKEN: ${{ secrets.PR_STATS_TOKEN }}
          OUT: dist/telemetry.svg
        run: python3 .github/scripts/telemetry.py

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF2D4A&color_dots=#161B22,#3A0F1A,#7A1A2C,#C2263F,#FF5368

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
